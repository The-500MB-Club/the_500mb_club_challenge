openapi: 3.1.0
info:
  title: Pi-Bench Telemetry API
  version: 1.0.0
  description: |
    Contrato unico para todas as submissoes Pi-Bench. Cada implementacao
    DEVE atender exatamente este contrato. Comportamento divergente
    desclassifica a submissao do benchmark.
  license:
    name: MIT
servers:
  - url: http://localhost:8080
    description: via load balancer

paths:
  /healthz:
    get:
      summary: Liveness probe
      description: Retorna 200 enquanto o processo estiver vivo. Nao consulta Redis.
      responses:
        '200':
          description: alive

  /readyz:
    get:
      summary: Readiness probe
      description: 200 quando o servico esta pronto para receber trafego (Redis OK, pool montado).
      responses:
        '200': { description: ready }
        '503': { description: not ready }

  /metrics:
    get:
      summary: Exposicao Prometheus
      responses:
        '200':
          description: ok
          content:
            text/plain; version=0.0.4: {}

  /devices/{id}/telemetry:
    post:
      summary: Ingerir um ponto de telemetria
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{1,64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryPoint'
      responses:
        '202':
          description: aceito (persistencia pode ser sincrona ou async)
        '400':
          description: payload invalido
        '413':
          description: payload muito grande
        '429':
          description: rate limited (opcional)

    get:
      summary: Consultar janela temporal
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,64}$' }
        - in: query
          name: from
          required: true
          schema: { type: integer, format: int64, description: epoch millis }
        - in: query
          name: to
          required: true
          schema: { type: integer, format: int64, description: epoch millis }
        - in: query
          name: limit
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
        - in: query
          name: cursor
          schema: { type: string, description: opaque cursor para paginacao }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [points]
                properties:
                  points:
                    type: array
                    items: { $ref: '#/components/schemas/TelemetryPoint' }
                  next_cursor:
                    type: string
                    nullable: true
        '400': { description: parametros invalidos }
        '404': { description: device sem dados }

  /devices/{id}/telemetry/batch:
    post:
      summary: Ingestao em lote
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/TelemetryPoint' }
      responses:
        '202':
          description: aceito
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
        '400': { description: lote invalido }
        '413': { description: lote excede 100 pontos }

  /devices/{id}/anomaly:
    get:
      summary: Z-score da magnitude da aceleracao sobre os ultimos 256 pontos
      description: |
        Computa magnitude = sqrt(ax^2 + ay^2 + az^2) para cada um dos
        ultimos 256 pontos do device, depois z-score do ponto mais recente
        contra a media e desvio dessa janela. Sem cache permitido.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,64}$' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [z_score, samples, anomalous]
                properties:
                  z_score:    { type: number }
                  samples:    { type: integer, minimum: 0, maximum: 256 }
                  anomalous:  { type: boolean, description: 'true se |z| > 3' }
                  mean:       { type: number }
                  stddev:     { type: number }
        '404':
          description: device sem dados suficientes (< 8 pontos)

components:
  schemas:
    TelemetryPoint:
      type: object
      required: [ts, lat, lon, ax, ay, az]
      properties:
        ts:      { type: integer, format: int64, description: epoch millis }
        lat:     { type: number, minimum: -90,  maximum: 90 }
        lon:     { type: number, minimum: -180, maximum: 180 }
        battery: { type: number, minimum: 0,    maximum: 1 }
        ax:      { type: number }
        ay:      { type: number }
        az:      { type: number }
